baseURL = "https://datng17.github.io/container-microservice/"
relativeURLs = false
canonifyURLs = true
defaultContentLanguage = "en"

# Change the default theme to be use when building the site with Hugo
theme = "hugo-theme-learn"

# For search functionality
[outputs]
home = [ "HTML", "RSS", "JSON"]

[params]
  # Change default color scheme with a variant one. Can be "red", "blue", "green".
  themeVariant = "workshop"
  # Git hub repo link
  editURL = ""
  description = ""
  author = "thienlh@thienlu.com"
  showVisitedLinks = true
  disableBreadcrumb = false
  disableNextPrev = false
  
[Languages]
[Languages.en]
title = "Deploy Spring Boot on ECS Fargate with AWS CDK TypeScript"
weight = 1
languageName = "English"

[Languages.vi]
title = "Triển khai Spring Boot lên ECS Fargate bằng AWS CDK TypeScript"
weight = 2
languageName = "Tiếng Việt"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
